# XcodeGen 설정: COMMANDER 서버 앱(iOS). Server.xcodeproj 는 저장소에 두지 않고 `xcodegen generate` 로 만든다.
# 엔진 파일(App/Resources/engine.js)은 `cd engine && bun build.ts` 가 만들어 `cp engine/dist/engine.js App/Resources/` 로 넣는다. (CI가 한다)
name: CommanderServer
options:
  bundleIdPrefix: com.officialgl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ServerKit:
    path: ServerKit
targets:
  CommanderServer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/engine.js
      - path: App/Resources/engine.js
        optional: true
        buildPhase: resources
      - path: ../web
        type: folder
        buildPhase: resources
    dependencies:
      - package: ServerKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: COMMANDER 서버
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 같은 와이파이의 기기가 접속하고(로컬 네트워크), 서버를 알린다(Bonjour).
        NSLocalNetworkUsageDescription: 같은 와이파이의 기기가 이 서버에 접속하고, 이 서버를 찾을 수 있게 하기 위해 필요해요.
        NSBonjourServices:
          - _commander._tcp
        # "파일" 앱에서 전적과 플러그인 폴더를 볼 수 있게 한다.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.officialgl.commander.server
        PRODUCT_NAME: CommanderServer
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
