name: Deploy server

# main에 서버 코드가 합쳐지면 Cloudflare Workers에 배포한다. 수동 실행도 가능하다.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않게 한 번에 하나만 돌린다. 진행 중인 배포는 끊지 않고 기다린다.
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub 저장소 설정의 Environments > production 에서 승인자를 지정하면,
    # 배포 전에 사람이 승인해야 하도록 만들 수 있다.
    environment: production
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 배포에 필요한 시크릿 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub 저장소의 Secrets에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 를 등록해야 한다. (server/README.md의 '배포' 참고)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # 저장소에 고정된 wrangler 버전으로 배포한다. (별도의 서드파티 액션을 쓰지 않는다)
      - name: Cloudflare Workers에 배포
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
