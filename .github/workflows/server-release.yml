name: Server release

# 서버 앱을 릴리스로 올린다. (태그 server-vX.Y.Z)
# - 로컬 서버: 윈도우 .exe, 맥(애플 실리콘·인텔), 리눅스 실행파일, 우분투 .deb — 바닐라와 엑스퍼트
# - iPhone·iPad 서버 앱: 서명 없는 CommanderServer.ipa (SideStore 소스에도 올라간다, 시험판)
# 빌드와 실행 점검은 local-server.yml, ios-server-app.yml 을 그대로 불러서 한다. 점검을 통과해야 릴리스가 만들어진다.
#
# 실행: Actions 탭 > Server release > Run workflow 에서 버전(예: 0.1.0)을 적는다. (main 에서만)
#       또는 태그 server-vX.Y.Z 를 올린다.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "릴리스 버전 (예: 0.1.0)"
        required: true
  push:
    tags: ["server-v*"]

permissions:
  contents: write # 릴리스와 SideStore 소스를 올리려고

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  version:
    name: 버전 확인
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/server-v* ]]; then
            version="${GITHUB_REF_NAME#server-v}"
          else
            version="${INPUT_VERSION#v}"
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::릴리스는 main 브랜치에서만 만들 수 있다. (현재: ${GITHUB_REF_NAME})"; exit 1
            fi
            if gh release view "server-v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::이미 있는 릴리스다: server-v${version}. 다른 버전을 적어 주세요."; exit 1
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 0.1.0 같은 형식이어야 한다. (입력: ${version})"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "릴리스할 버전: server-v${version}"

  desktop:
    name: 로컬 서버 (윈도우·맥·리눅스)
    needs: version
    uses: ./.github/workflows/local-server.yml
    with:
      version: ${{ needs.version.outputs.version }}

  ipad:
    name: iPhone·iPad 서버 앱
    needs: version
    uses: ./.github/workflows/ios-server-app.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: 릴리스에 올리기
    needs: [version, desktop, ipad]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: commander-server
          path: in/desktop
      - uses: actions/download-artifact@v4
        with:
          name: commander-server-macos
          path: in/macos
      - uses: actions/download-artifact@v4
        with:
          name: CommanderServer-unsigned-ipa
          path: in/ipad
      - name: 파일 이름 정리
        run: |
          mkdir -p out
          ls -R in
          cp in/desktop/commander-server.exe                out/commander-server-windows.exe
          cp in/desktop/commander-server-expert.exe         out/commander-server-expert-windows.exe
          cp in/desktop/commander-server                    out/commander-server-linux-x64
          cp in/desktop/commander-server-expert             out/commander-server-expert-linux-x64
          cp in/desktop/commander-server_${VERSION}_amd64.deb out/
          cp in/macos/commander-server-macos                out/commander-server-macos-apple-silicon
          cp in/macos/commander-server-expert-macos         out/commander-server-expert-macos-apple-silicon
          cp in/macos/commander-server-macos-intel          out/commander-server-macos-intel
          cp in/macos/commander-server-expert-macos-intel   out/commander-server-expert-macos-intel
          cp in/ipad/CommanderServer.ipa                    out/CommanderServer.ipa
          chmod +x out/*-linux-x64 out/*-macos-*
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -lh out
      - name: 릴리스 만들기
        run: |
          cat > notes.md <<NOTES
          COMMANDER 서버 ${VERSION}

          같은 와이파이에서 친구들과 할 때 PC(또는 iPhone·iPad·안드로이드 폰) 한 대를 서버로 켭니다. 전적은 그 기기에 남습니다.
          설치 안내: https://edgame-api.officialgl.com/install.html#server

          | 기기 | 파일 |
          |---|---|
          | 윈도우 | \`commander-server-windows.exe\` |
          | 맥 (M1 이후) | \`commander-server-macos-apple-silicon\` |
          | 맥 (인텔) | \`commander-server-macos-intel\` |
          | 우분투 | \`commander-server_${VERSION}_amd64.deb\` (앱 메뉴에 "COMMANDER 서버") |
          | 리눅스 | \`commander-server-linux-x64\` |
          | iPhone·iPad (시험판) | \`CommanderServer.ipa\` — SideStore 의 COMMANDER 소스에서도 설치. 앱을 화면에 켜 두고, 그 기기에서 하려면 '이 기기에서 하기' |

          \`expert\` 가 붙은 파일은 엑스퍼트 서버입니다. (\`commander-data/plugins/\` 의 콘텐츠 팩을 읽음)
          서명하지 않은 파일이라 윈도우는 "추가 정보 → 실행", 맥은 처음 한 번 \`xattr -d com.apple.quarantine <파일>\` 이 필요합니다.
          NOTES
          # 태그가 이미 있으면(태그를 올려서 실행한 경우) 그대로 쓰고, 없으면 이 커밋에 태그를 만든다.
          gh release create "server-v${VERSION}" out/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "COMMANDER 서버 ${VERSION}" --notes-file notes.md

      # 서버 앱(iPhone·iPad)을 SideStore 소스(서버의 /sidestore.json)에 싣는다. (ios.yml 과 같은 방법)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SideStore 소스 갱신
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > "$RUNNER_TEMP/releases.json"
          (cd server && node --experimental-strip-types --no-warnings scripts/make-sidestore-source.mjs \
            "$RUNNER_TEMP/releases.json" "https://edgame-api.officialgl.com/sidestore.json") > "$RUNNER_TEMP/sidestore.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print([(a['name'], a['version']) for a in d['apps']])" "$RUNNER_TEMP/sidestore.json"
          if ! gh release view sidestore-source --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create sidestore-source --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --prerelease \
              --title "SideStore 소스 (자동 생성)" \
              --notes "서버의 /sidestore.json 이 읽어 가는 파일입니다. iOS·서버 릴리스를 올릴 때마다 자동으로 갱신되며 직접 고치지 마세요."
          fi
          gh release upload sidestore-source "$RUNNER_TEMP/sidestore.json" --repo "${GITHUB_REPOSITORY}" --clobber
