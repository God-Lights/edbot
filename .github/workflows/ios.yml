name: iOS

# EdbotKit 테스트(Linux)와 서명 없는 .ipa 빌드(macOS). 태그 ios-v* 를 올리면 릴리스에 .ipa를 올린다.
# 서명하지 않은 .ipa 라서 설치할 때 Sideloadly/AltStore 에서 자기 Apple ID로 서명한다.
# (인증서와 비밀번호를 저장소나 워크플로에 두지 않는다.)
on:
  push:
    branches: [main, "claude/**"]
    tags: ["ios-v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  # Actions 탭 > iOS > Run workflow 에서 버전(예: 0.1.0)을 적고 실행하면 릴리스까지 만든다.
  # 버전을 비워 두면 빌드만 하고 .ipa 를 Artifacts 에 올린다.
  workflow_dispatch:
    inputs:
      release_version:
        description: "릴리스로 올릴 버전 (예: 0.1.0). 비우면 릴리스 없이 빌드만 한다."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-tests:
    name: EdbotKit 테스트
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/EdbotKit
        run: swift test

  build-ipa:
    name: .ipa 빌드 (서명 없음)
    needs: kit-tests
    runs-on: macos-15
    permissions:
      contents: write # 태그일 때 릴리스에 올리려고
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: ios
        run: xcodegen generate

      - name: 버전 정하기
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스하는 경우: 태그(ios-v0.2.0)를 올렸거나, 수동 실행에서 버전을 적었을 때.
          release=""
          if [[ "${GITHUB_REF}" == refs/tags/ios-v* ]]; then
            release="${GITHUB_REF_NAME#ios-v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            release="${INPUT_VERSION#v}"
            if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::버전은 0.1.0 같은 형식이어야 한다. (입력: ${INPUT_VERSION})"
              exit 1
            fi
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::릴리스는 main 브랜치에서만 만들 수 있다. (현재: ${GITHUB_REF_NAME})"
              exit 1
            fi
            if gh release view "ios-v${release}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::이미 있는 릴리스다: ios-v${release}. 다른 버전을 적어 주세요."
              exit 1
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "marketing=${release:-0.0.0-dev}" >> "$GITHUB_OUTPUT"

      - name: 아카이브 (서명 끔)
        working-directory: ios
        shell: bash
        run: |
          xcodebuild archive \
            -project Commander.xcodeproj \
            -scheme Commander \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Commander.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40

      - name: .ipa 만들기
        working-directory: ios
        run: |
          rm -rf build/Payload build/Commander.ipa
          mkdir -p build/Payload
          cp -R build/Commander.xcarchive/Products/Applications/Commander.app build/Payload/
          (cd build && zip -qr Commander.ipa Payload)
          ls -lh build/Commander.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Commander-unsigned-ipa
          path: ios/build/Commander.ipa
          if-no-files-found: error

      - name: 릴리스에 올리기
        if: steps.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.release }}
        run: |
          # icon.png 는 SideStore 소스(/sidestore.json)가 앱 아이콘으로 쓴다.
          cp ios/EdbotApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png ios/build/icon.png
          # 태그가 이미 있으면(태그를 올려서 실행한 경우) 그대로 쓰고, 없으면 이 커밋에 태그를 만든다.
          gh release create "ios-v${VERSION}" ios/build/Commander.ipa ios/build/icon.png \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "COMMANDER iPad ${VERSION}" \
            --notes "서명 없는 .ipa 입니다. SideStore 소스 https://edgame-api.officialgl.com/sidestore.json 를 추가하거나, Sideloadly/AltStore 로 본인 Apple ID 로 서명해서 설치하세요."
