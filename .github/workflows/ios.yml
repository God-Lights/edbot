name: iOS

# 서명 없는 .ipa 를 macOS 에서 빌드한다. (작업 하나, EdbotKit 테스트 포함)
# - ios/ 를 바꾸는 PR: 테스트와 빌드만 확인
# - Actions 탭 > iOS > Run workflow 에서 버전(예: 0.1.2)을 적고 실행: 릴리스와 SideStore 소스까지 만든다
# - 태그 ios-vX.Y.Z 를 올려도 같다
# 서명하지 않은 .ipa 라서 설치할 때 SideStore/Sideloadly 에서 자기 Apple ID 로 서명한다.
# (인증서와 비밀번호를 저장소나 워크플로에 두지 않는다.)
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "릴리스로 올릴 버전 (예: 0.1.2). 비우면 릴리스 없이 빌드만 한다."
        required: false
        default: ""

permissions:
  contents: write # 릴리스에 올리려고

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: 시연 화면 스크린샷 (시뮬레이터)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 프로젝트 생성
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 시뮬레이터에서 준비·전투 화면 찍기
        run: ios/scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/build/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  build:
    name: 테스트와 .ipa 빌드 (서명 없음)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: EdbotKit 테스트
        working-directory: ios/EdbotKit
        run: swift test

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: ios
        run: xcodegen generate

      - name: 버전 정하기
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스하는 경우: 태그(ios-v0.2.0)를 올렸거나, 수동 실행에서 버전을 적었을 때.
          release=""
          if [[ "${GITHUB_REF}" == refs/tags/ios-v* ]]; then
            release="${GITHUB_REF_NAME#ios-v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            release="${INPUT_VERSION#v}"
            if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::버전은 0.1.0 같은 형식이어야 한다. (입력: ${INPUT_VERSION})"
              exit 1
            fi
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::릴리스는 main 브랜치에서만 만들 수 있다. (현재: ${GITHUB_REF_NAME})"
              exit 1
            fi
            if gh release view "ios-v${release}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::이미 있는 릴리스다: ios-v${release}. 다른 버전을 적어 주세요."
              exit 1
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          # CFBundleVersion 은 숫자와 점만 허용된다. 개발용 빌드는 0.0.0.
          echo "marketing=${release:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: 아카이브 (서명 끔)
        working-directory: ios
        shell: bash
        run: |
          mkdir -p build
          # 전체 로그는 build/xcodebuild.log에 두고, 실패하면 컴파일 오류 줄만 따로 보여 준다. (tail만 보면 오류가 잘려서 안 보인다)
          set +e
          xcodebuild archive \
            -project Commander.xcodeproj \
            -scheme Commander \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Commander.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.marketing }}" \
            > build/xcodebuild.log 2>&1
          status=$?
          tail -n 40 build/xcodebuild.log
          if [ "$status" -ne 0 ]; then
            echo "::group::컴파일 오류"
            grep -E "error:" build/xcodebuild.log | sort -u | head -40
            echo "::endgroup::"
          fi
          exit "$status"

      - name: .ipa 만들기
        working-directory: ios
        env:
          VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          rm -rf build/Payload build/Commander.ipa
          mkdir -p build/Payload
          cp -R build/Commander.xcarchive/Products/Applications/Commander.app build/Payload/
          # SideStore 는 앱의 CFBundleVersion 이 소스의 buildVersion(= 버전 번호)과 같은지 검사한다.
          # 빌드 설정이 적용되지 않는 경우에 대비해 앱의 Info.plist 를 직접 맞추고, 맞는지 확인한다.
          PLIST=build/Payload/Commander.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" -c "Set :CFBundleVersion ${VERSION}" "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "${VERSION}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.officialgl.commander"
          (cd build && zip -qr Commander.ipa Payload)
          ls -lh build/Commander.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Commander-unsigned-ipa
          path: ios/build/Commander.ipa
          if-no-files-found: error

      - name: 릴리스에 올리기
        if: steps.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.release }}
        run: |
          # icon.png 는 SideStore 소스(/sidestore.json)가 앱 아이콘으로 쓴다.
          cp ios/EdbotApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png ios/build/icon.png
          # 태그가 이미 있으면(태그를 올려서 실행한 경우) 그대로 쓰고, 없으면 이 커밋에 태그를 만든다.
          gh release create "ios-v${VERSION}" ios/build/Commander.ipa ios/build/icon.png \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "COMMANDER iPad ${VERSION}" \
            --notes "서명 없는 .ipa 입니다. SideStore 소스 https://edgame-api.officialgl.com/sidestore.json 를 추가하거나, Sideloadly/AltStore 로 본인 Apple ID 로 서명해서 설치하세요."

      # 릴리스를 올린 뒤, 서버(/sidestore.json)가 가져다 쓸 SideStore 소스 파일을 만들어 고정 릴리스 sidestore-source 에 올린다.
      # 서버가 GitHub API 대신 이 파일을 읽는다. (Workers 의 공유 IP 에서는 API 호출 한도에 걸려 403 이 난다)
      - uses: actions/setup-node@v4
        if: steps.version.outputs.release != ''
        with:
          node-version: 22

      - name: SideStore 소스 갱신
        if: steps.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > "$RUNNER_TEMP/releases.json"
          (cd server && node --experimental-strip-types --no-warnings scripts/make-sidestore-source.mjs \
            "$RUNNER_TEMP/releases.json" "https://edgame-api.officialgl.com/sidestore.json") > "$RUNNER_TEMP/sidestore.json"
          if ! gh release view sidestore-source --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create sidestore-source --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --prerelease \
              --title "SideStore 소스 (자동 생성)" \
              --notes "서버의 /sidestore.json 이 읽어 가는 파일입니다. iOS 릴리스를 올릴 때마다 자동으로 갱신되며 직접 고치지 마세요."
          fi
          gh release upload sidestore-source "$RUNNER_TEMP/sidestore.json" --repo "${GITHUB_REPOSITORY}" --clobber
