# XcodeGen 설정. Commander.xcodeproj 는 저장소에 두지 않고 `xcodegen generate` 로 만든다.
name: Commander
options:
  bundleIdPrefix: com.officialgl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EdbotKit:
    path: EdbotKit
targets:
  Commander:
    type: application
    platform: iOS
    sources:
      - EdbotApp
    dependencies:
      - package: EdbotKit
    info:
      path: EdbotApp/Info.plist
      properties:
        CFBundleDisplayName: COMMANDER
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        # 아이폰은 가로 전용. 아이패드도 가로만 쓴다.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 개발 중 로컬 서버(http://192.168.x.x:8787)에 붙을 수 있게 한다. 운영 서버는 https다.
        # 같은 와이파이의 로컬 서버를 찾고(Bonjour), QR 링크(commander://)로 열린다.
        NSLocalNetworkUsageDescription: 같은 와이파이에서 COMMANDER 서버를 찾고 접속하기 위해 필요해요.
        NSBonjourServices:
          - _commander._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.officialgl.commander.connect
            CFBundleURLSchemes:
              - commander
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 게임 컨트롤러(엑스박스·플레이스테이션·MFi). 앱이 버튼을 직접 읽는다 (Controller.swift)
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        GCSupportsControllerUserInteraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.officialgl.commander
        PRODUCT_NAME: Commander
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
